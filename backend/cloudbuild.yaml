substitutions:
  _REGION: asia-south2
  _SERVICE: innoalaxy
  _REPOSITORY: innoalaxy

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID", "-f", "backend/Dockerfile", "backend/"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=ENVIRONMENT=production,GEMINI_MODEL=gemini-2.5-flash,TWILIO_WHATSAPP_FROM=whatsapp:+14155238886,WHATSAPP_DEMO_MODE=false
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,INNOALAXY_ADMIN_KEY=INNOALAXY_ADMIN_KEY:latest,FRONTEND_URL=FRONTEND_URL:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,PIYUSH_WHATSAPP_NUMBER=PIYUSH_WHATSAPP_NUMBER:latest,GROQ_API_KEY=GROQ_API_KEY:latest,GEMINI_API_KEY_2=GEMINI_API_KEY_2:latest,GROQ_API_KEY_2=GROQ_API_KEY_2:latest,GROQ_API_KEY_3=GROQ_API_KEY_3:latest,GROQ_API_KEY_4=GROQ_API_KEY_4:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

